# docker-compose.override.yml — generated by CustomClaw dashboard
# Enables full unrestricted access for Hermes inside the Virtual Environment
# Bridge networking + dashboard_default network connection + privileged access.
services:
  gateway:
    network_mode: "bridge"
    privileged: true
    cap_add:
      - ALL
    ports:
      - "8080:8080"
      - "3978:3978"
    volumes:
      - ~/.hermes:/opt/data
      - ../:/workspace:rw
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      - HERMES_YOLO_MODE=1
      - HERMES_UNRESTRICTED=1
      - DISPLAY=cloud-desktop:1
      - HERMES_COMPUTER_USE_DISPLAY=:1
      - AGENT_BROWSER_EXECUTABLE_PATH=/usr/bin/chromium
      - PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium
      - AGENT_BROWSER_FLAGS=--no-sandbox --disable-dev-shm-usage

  dashboard:
    network_mode: "bridge"
    privileged: true
    cap_add:
      - ALL
    ports:
      - "9119:9119"
    volumes:
      - ~/.hermes:/opt/data
      - ../:/workspace:rw
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      - HERMES_YOLO_MODE=1
      - HERMES_UNRESTRICTED=1
      - AGENT_BROWSER_EXECUTABLE_PATH=/usr/bin/chromium
      - PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium
      - AGENT_BROWSER_FLAGS=--no-sandbox --disable-dev-shm-usage
    command: ["dashboard", "--host", "0.0.0.0", "--no-open"]

networks:
  default:
    name: dashboard_default
    external: true
