# docker-compose.override.yml — generated by CustomClaw dashboard
# Switches from network_mode:host (Linux-only, broken on macOS Docker Desktop)
# to bridge networking with explicit port mapping.
# Login: admin / admin
services:
  gateway:
    network_mode: "bridge"
    ports:
      - "8080:8080"
      - "3978:3978"

  dashboard:
    network_mode: "bridge"
    ports:
      - "9119:9119"
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=admin
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH=scrypt$$16384$$8$$1$$D09rfNxumhaxO5+SA4nAMg==$$jRdYWer8doecZP/8JNs5QO8Xcym2IRhyyR4p3YSQx/U=
    command: ["dashboard", "--host", "0.0.0.0", "--no-open"]
